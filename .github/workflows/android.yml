name: Android CI and Signed Release

on:
  push:
    branches: [ "master", "main", "jules-*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Do not let two master builds publish/remove releases at the same time.
concurrency:
  group: exchange-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Unit tests and debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload test APK for PR / branch builds
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: exchange-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish latest release
    needs: verify
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore fixed Actions signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "$(printenv "$required")" ]]; then
              echo "::error::Missing Actions Secret $required. Aborting without publishing a debug-signed APK."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/exchange-release.jks"
          test -s "$RUNNER_TEMP/exchange-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/exchange-release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          echo "Fixed keystore and alias validated (key contents not printed)."

      - name: Build and verify signed Release APK
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            "-PbuildVersionCode=$GITHUB_RUN_NUMBER" \
            "-PsigningStoreFile=$RUNNER_TEMP/exchange-release.jks"
          # Report exact failures: a plain `test -s` or command substitution
          # previously hid which post-build check returned exit code 1.
          echo "::group::Locate release APK"
          find app/build/outputs/apk -maxdepth 3 -type f -printf '%p (%s bytes)\n'
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$apk" ]]; then
            echo "::error::Expected signed APK not found: $apk"
            exit 1
          fi
          echo "Release APK located: $apk"
          echo "::endgroup::"

          echo "::group::Verify release APK signature"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android build-tools directory is missing."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ ! -x "$apksigner" ]]; then
            echo "::error::apksigner not found or not executable."
            exit 1
          fi
          echo "Using: $apksigner"
          # Never suppress apksigner diagnostics on failure. No private keys,
          # passwords or keystore contents are printed by verify.
          if ! "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner-report.txt" 2>&1; then
            cat "$RUNNER_TEMP/apksigner-report.txt"
            echo "::error::apksigner verification failed. Keeping the previous Release."
            exit 1
          fi
          cat "$RUNNER_TEMP/apksigner-report.txt"
          # Build Tools 37 emits "V2 Signer: certificate SHA-256 digest:"
          # while older apksigner versions emit "Signer #1 certificate ...".
          # Match the shared field name instead of the version-specific prefix.
          cert_sha="$(awk '/certificate SHA-256 digest:/ { print $NF; exit }' "$RUNNER_TEMP/apksigner-report.txt")"
          if [[ ! "$cert_sha" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Verified APK, but cannot parse the 64-character signer SHA-256 fingerprint."
            exit 1
          fi
          cert_sha="${cert_sha,,}"
          echo "::endgroup::"

          mkdir -p build/release
          cp "$apk" build/release/exchange-latest.apk
          (
            cd build/release
            sha256sum exchange-latest.apk > exchange-latest.apk.sha256
          )
          printf 'Signer SHA256: %s\nCommit: %s\nversionCode: %s\n' \
            "$cert_sha" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > build/release/SIGNING-INFO.txt
          echo "SIGNER_SHA256=$cert_sha" >> "$GITHUB_ENV"
          echo "### Verified signed Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate SHA-256: $cert_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "versionCode: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish new release and remove older releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Do not publish a stale build when a newer master revision exists.
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "master has advanced; skipping obsolete release."
            exit 0
          fi

          # Preserve upgrade compatibility: do not rotate signing certificates.
          previous_json=""
          if previous_json="$(gh api "repos/$GH_REPO/releases/latest" 2>"$RUNNER_TEMP/last-release-error")"; then
            old_signer="$(printf '%s' "$previous_json" | jq -r '.body // ""' | sed -n 's/^Signer SHA256: //p' | head -n 1)"
            if [[ -n "$old_signer" && "$old_signer" != "$SIGNER_SHA256" ]]; then
              echo "::error::Signer differs from the current Release. Previous release is preserved."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/last-release-error"; then
            cat "$RUNNER_TEMP/last-release-error" >&2
            exit 1
          fi

          tag="ci-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          cat > build/release/RELEASE-NOTES.md <<EOF
          Signer SHA256: $SIGNER_SHA256
          Commit: $GITHUB_SHA
          versionCode: $GITHUB_RUN_NUMBER

          Automated signed Android Release APK from master.
          Tests and APK signature verification passed.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              build/release/exchange-latest.apk \
              build/release/exchange-latest.apk.sha256 \
              build/release/SIGNING-INFO.txt --clobber
            gh release edit "$tag" --latest \
              --notes-file build/release/RELEASE-NOTES.md
          else
            gh release create "$tag" \
              build/release/exchange-latest.apk \
              build/release/exchange-latest.apk.sha256 \
              build/release/SIGNING-INFO.txt \
              --target "$GITHUB_SHA" \
              --latest \
              --title "我的匯率 最新版 ($tag)" \
              --notes-file build/release/RELEASE-NOTES.md
          fi

          # Validate ALL published assets before deleting any older Release.
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fxq exchange-latest.apk <<< "$assets"
          grep -Fxq exchange-latest.apk.sha256 <<< "$assets"
          grep -Fxq SIGNING-INFO.txt <<< "$assets"

          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' |
            while IFS= read -r old_tag; do
              [[ -z "$old_tag" || "$old_tag" == "$tag" ]] && continue
              gh release delete "$old_tag" --yes --cleanup-tag
            done

          echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/latest" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json url,assets --jq '{url,assets:[.assets[].name]}'

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/exchange-release.jks"
